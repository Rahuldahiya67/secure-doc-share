name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the APP_KEY and KEYSTORE_BASE64 repository secrets (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: android
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SecureDocShare.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Android app v${{ github.run_number }}
          body: |
            Secure Doc Share Android viewer. Screenshots and screen recording are blocked inside the app.
            Download **SecureDocShare.apk** below on your Android phone and install it.
          files: SecureDocShare.apk
          make_latest: true
